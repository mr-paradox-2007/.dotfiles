# Import your theme (adjust the path to match your actual theme location)
general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[font]
size = 12.0

[font.normal]
family = "BigBlue TerminalPlus"
style = "Regular"

[font.bold]
family = "BigBlue TerminalPlus"
style = "Regular"

[font.bold_italic]
family = "BigBlue TerminalPlus"
style = "Regular"

[font.italic]
family = "BigBlue TerminalPlus"
style = "Italic"

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black   = "#3c3836"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
