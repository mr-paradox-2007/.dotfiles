# Import your theme (adjust the path to match your actual theme location)
general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[font]
size = 12.0

[font.normal]
family = "BigBlueTermPlus Nerd Font Mono"
style = "Regular"

[font.bold]
family = "BigBlueTermPlus Nerd Font Mono"
style = "Regular"

[font.bold_italic]
family = "BigBlueTermPlus Nerd Font Mono"
style = "Regular"

[font.italic]
family = "BigBlueTermPlus Nerd Font Mono"
style = "Italic"

# Everforest Dark Color Scheme
[colors.primary]
background = '#2b3339'
foreground = '#d3c6aa'

[colors.normal]
black   = '#475054'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.bright]
black   = '#4d575c'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'
