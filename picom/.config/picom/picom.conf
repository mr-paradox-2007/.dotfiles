# --- Backend ---
backend = "glx";

unredir-if-possible = true;


# --- Rounded Corners ---
corner-radius = 10;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'dmenu'",
  "class_g = 'Rofi'"
];

# --- Fading Animations ---
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 5;
fade-exclude = [
  "class_g = 'dmenu'",
  "class_g = 'Rofi'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.75;
shadow-offset-x = 5;
shadow-offset-y = 5;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'dmenu'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];
detect-rounded-corners = true;

# --- Background Blur ---
blur: {
  method = "dual_kawase";
  strength = 2;
  background = true;
  background-frame = false;
  background-fixed = false;
}
blur-background-exclude = [
  "window_type = 'dock'",
  "class_g = 'slop'"
];

# --- Opacity & Dimming ---
# Using specific opacity rules is better than global dimming
# because global dimming often makes text hard to read.
active-opacity = 1.0;
inactive-opacity = 0.90;
inactive-dim = 0.75;
# ^ keep these active -- focus-exclude below is what protects rofi/menus
# from them now, so you don't need to disable them globally.

opacity-rule = [
  "85:class_g = 'Alacritty' && focused",
  "100:class_g = 'Rofi'",
  "100:class_g = 'dmenu'",
  "100:window_type = 'popup_menu'",
  "100:window_type = 'dropdown_menu'",
  "100:window_type = 'tooltip'",
  "100:window_type = 'utility'"
];

# focus-exclude: matched windows are always treated as FOCUSED,
# so inactive-opacity/inactive-dim never apply to them, period.
# This is the actual fix -- inactive-dim-exclude is not a real picom option.
focus-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'dmenu'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'"
];

# --- Window Type Overrides ---
# "focus = true" forces picom to treat these as always-focused,
# so inactive-opacity / inactive-dim never apply to them at all.
# This is the strongest fix -- bypasses rule-matching entirely.
wintypes:
{
  popup_menu = { opacity = 1.00; focus = true; fade = false; shadow = false; }
  dropdown_menu = { opacity = 1.00; focus = true; fade = false; shadow = false; }
  tooltip = { opacity = 1.00; focus = true; fade = true; shadow = false; }
  utility = { opacity = 1.00; focus = true; }
  menu = { opacity = 1.00; focus = true; fade = false; shadow = false; }
  dnd = { shadow = false; }
  dock = { shadow = false; }
};
