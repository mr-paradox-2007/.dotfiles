# --- Backend ---
backend = "glx";

# --- Rounded Corners ---
corner-radius = 10;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'dmenu'",
  "class_g = 'rofi'"
];

# --- Fading Animations ---
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 5;
fade-exclude = [
  "class_g = 'dmenu'",
  "class_g = 'rofi'"
];

# --- Shadows ---
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.75;
shadow-offset-x = 5;
shadow-offset-y = 5;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'dmenu'",
  "class_g = 'rofi'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];
detect-rounded-corners = true;

# --- Background Blur ---
blur: {
  method = "dual_kawase";
  strength = 2;
  background = true;
  background-frame = false;
  background-fixed = false;
}
blur-background-exclude = [
  "window_type = 'dock'",
  "class_g = 'slop'"
];

# --- Opacity & Dimming ---
# Using specific opacity rules is better than global dimming
# because global dimming often makes text hard to read.
active-opacity = 1.0;
inactive-opacity = 0.90;
inactive-dim = 0.75;

opacity-rule = [
  "85:class_g = 'Alacritty' && focused"
];
