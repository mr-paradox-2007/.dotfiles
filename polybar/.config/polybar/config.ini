[colors]
; --- Nordic Ice Theme Colors ---
background = #2E3440
background-alt = #3B4252
foreground = #D8DEE9
primary = #88C0D0
secondary = #81A1C1
alert = #BF616A
disabled = #4C566A

[bar/example]
width = 100%
offset-x = 0%
offset-y = 0
height = 28pt
radius = 12

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 1

separator = " │ "
separator-foreground = ${colors.disabled}

font-0 = BigBlueTermPlus Nerd Font Mono;2

; Cleaned up the modules list (Added battery before the date)
modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio memory cpu wlan systray battery date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
; Shortened max length to 40 characters so it doesn't crowd the bar
label = %title:0:40:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
; Replaced the ugly root path and yellow hex code with a clean prefix
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
label-unmounted = unmounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.primary}
; Removed IP address, kept only the network name (SSID)
label-connected = %essid%
label-disconnected = disconnected
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15

; Automatically detect hardware via your system paths
; (Change BAT0/ADP1 if your terminal outputs different names)
battery = BAT0
adapter = ADP1
poll-interval = 5

; Formatting matches your clean text prefix style
format-charging = <label-charging>
format-charging-prefix = "BAT+ "
format-charging-prefix-foreground = ${colors.primary}

format-discharging = <label-discharging>
format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.primary}

format-full = <label-full>
format-full-prefix = "BAT "
format-full-prefix-foreground = ${colors.primary}

format-low = <label-low>
format-low-prefix = "BAT "
format-low-prefix-foreground = ${colors.alert}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%
label-low = %percentage%% LOW

[module/date]
type = internal/date
interval = 1
; Changed to 12-hour format with AM/PM
date = %I:%M %p
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
